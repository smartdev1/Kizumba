# ==============================================================================
#  CI — Intégration Continue · UKWC 2026
#  Déclenché sur : push et PR vers main / feature_v2
#  Jobs : 1) Frontend Nuxt 4   2) Backend Laravel 11
# ==============================================================================

name: CI

on:
  push:
    branches: [main, feature_v2]
  pull_request:
    branches: [main, feature_v2]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Frontend (Nuxt 4)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build Nuxt 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache node_modules pour accélérer les builds suivants
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npm run typecheck
        continue-on-error: true   # Pas bloquant tant que les types ne sont pas tous définis

      - name: Build de production (SSR)
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: /api-proxy   # Proxy interne Nuxt (pas besoin du vrai backend en CI)
          NODE_ENV: production

      - name: Générer les fichiers statiques
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE_URL: /api-proxy
          NODE_ENV: production
        continue-on-error: true   # Le generate peut échouer si l'API n'est pas disponible — non bloquant

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Backend (Laravel 11 + PHPUnit)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Tests Laravel 11
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, xml, bcmath, zip, gd
          coverage: none   # Pas de coverage en CI pour garder les builds rapides

      # Cache du dossier vendor Composer
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev=false

      - name: Copier l'environnement CI
        run: cp ../.github/ci/.env.backend .env

      - name: Générer la clé applicative Laravel
        run: php artisan key:generate

      - name: Créer la base de données SQLite de test
        run: touch database/database.sqlite

      - name: Exécuter les migrations
        run: php artisan migrate --force

      - name: Exécuter les tests PHPUnit
        run: php artisan test --parallel
